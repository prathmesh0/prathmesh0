<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 220" width="580" height="220" role="img" aria-label="RepoLens - AI repository assistant - embeds repo files and answers questions with context-aware chat + visual file explorer.">
<title>RepoLens</title>
<style>
@keyframes run{to{stroke-dashoffset:-1520}}.run{stroke-dasharray:180 1340;animation:run 6s linear infinite}
@keyframes sweep{0%,60%{transform:translateX(-200px)}100%{transform:translateX(800px)}}.sw{animation:sweep 5s ease-in-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:1}70%,100%{transform:scale(2.8);opacity:0}}.ring{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:.7}}.gl{animation:glow 4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.cover,.cur{display:none}.rv{opacity:1!important}}
</style>
<defs>
  <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1917"/><stop offset="1" stop-color="#292524"/></linearGradient>
  <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <radialGradient id="halo" cx=".9" cy="0" r=".9"><stop offset="0" stop-color="#f97316" stop-opacity=".35"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></radialGradient>
  <clipPath id="c"><rect x="2" y="2" width="576" height="216" rx="18"/></clipPath>
</defs>
<g clip-path="url(#c)">
  <rect width="580" height="220" fill="url(#bg)"/>
  <rect class="gl" width="580" height="220" fill="url(#halo)"/>
  <rect class="sw" x="0" y="0" width="140" height="220" fill="url(#sh)" transform="skewX(-20)"/>
</g>
<rect x="2" y="2" width="576" height="216" rx="18" fill="none" stroke="#44403c" stroke-width="1.5"/>
<rect class="run" x="2" y="2" width="576" height="216" rx="18" fill="none" stroke="url(#bd)" stroke-width="2.5" stroke-linecap="round"/>
<rect x="28" y="28" width="38" height="38" rx="10" fill="url(#bd)"/>
<text x="47" y="54" text-anchor="middle" font-family="Oxanium,'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#1c1917">R</text>
<text x="80" y="55" font-family="Oxanium,'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#f5f5f4">RepoLens</text>
<rect x="486" y="32" width="66" height="26" rx="13" fill="#7ee78714" stroke="#7ee78755"/><circle class="ring" cx="501" cy="45" r="4" fill="none" stroke="#3fb950" stroke-width="2"/><circle cx="501" cy="45" r="4" fill="#3fb950"/><text x="530" y="50" text-anchor="middle" font-family="'Fira Code',ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" letter-spacing="1.5" fill="#7ee787">LIVE</text>
<text x="32" y="100" font-family="Oxanium,'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#d6d3d1">AI repository assistant - embeds repo files and answers</text><text x="32" y="122" font-family="Oxanium,'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#d6d3d1">questions with context-aware chat + visual file explorer.</text>
<text x="32" y="152" font-family="Oxanium,'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#0ea5e9">⚡ Up to 80% faster repo analysis</text>
<rect x="32" y="170" width="76" height="26" rx="13" fill="#f973161a" stroke="#f9731655"/><text x="70" y="187.5" text-anchor="middle" font-family="Oxanium,'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#f97316">Next.js</text><rect x="115.80000000000001" y="170" width="76" height="26" rx="13" fill="#f973161a" stroke="#f9731655"/><text x="154" y="187.5" text-anchor="middle" font-family="Oxanium,'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#f97316">Node.js</text><rect x="199.60000000000002" y="170" width="76" height="26" rx="13" fill="#f973161a" stroke="#f9731655"/><text x="238" y="187.5" text-anchor="middle" font-family="Oxanium,'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#f97316">MongoDB</text><rect x="283.40000000000003" y="170" width="83" height="26" rx="13" fill="#f973161a" stroke="#f9731655"/><text x="325" y="187.5" text-anchor="middle" font-family="Oxanium,'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#f97316">Tailwind</text><rect x="374.6" y="170" width="91" height="26" rx="13" fill="#f973161a" stroke="#f9731655"/><text x="420" y="187.5" text-anchor="middle" font-family="Oxanium,'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#f97316">Shadcn UI</text>
</svg>