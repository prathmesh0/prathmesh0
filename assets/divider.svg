<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" role="img" aria-label="divider">
<style>@keyframes mv{from{transform:translateX(-300px)}to{transform:translateX(1500px)}}.m{animation:mv 4s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}.cover,.cur{display:none}.rv{opacity:1!important}}</style>
<defs><linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#7c9cff" stop-opacity="0"/><stop offset=".2" stop-color="#7c9cff"/><stop offset=".5" stop-color="#22d3ee"/><stop offset=".8" stop-color="#f472b6"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></linearGradient>
<radialGradient id="g"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".4" stop-color="#22d3ee" stop-opacity=".6"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient></defs>
<rect x="0" y="11" width="1200" height="2" rx="1" fill="url(#l)" opacity=".7"/>
