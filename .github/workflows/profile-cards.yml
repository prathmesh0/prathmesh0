name: Update profile cards

# Builds profile/stats.svg (assets/stats.py) from public GitHub data and commits it
# so the README never depends on rate-limited public card servers.
on:
  schedule:
    - cron: "30 0 * * *" # every day at 06:00 IST
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-cards.yml"
      - "assets/stats.py"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build stats card
        run: python assets/stats.py ${{ github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: refresh profile cards" || exit 0
          git push
